    .title {

    .content {

      align-items: center;

    table {

      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #b0b0b0;
      margin-bottom: 20px;
      table-layout: fixed;
    }

    }

    }

    tr:nth-child(odd) {

    }

    th:nth-child(1),

    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 15%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 15%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 15%;
    }

    th:nth-child(5),

      width: 15%;
    }

    th:nth-child(6),

    th:nth-child(7),
    td:nth-child(7) {

    td input {

      border: 1px solid #b0b0b0;

    .results {

    }

    .results div {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
    }

    .results input {
      margin-left: 10px;

      border: 1px solid #b0b0b0;

      width: 80px;

    .buttons {

      display: flex;
      justify-content: space-between;

    .buttons button:hover {

    @media (max-width: 600px) {

        min-height: 100vh;
        padding: 10px 0;
        display: block;
      }

      .slide {

</head>

      <button onclick="window.location.href='./14.html'">Atrás</button>
      <button onclick="enviarTarea()">Enviar</button>

  <script>
    function enviarTarea() {
      // Solicitar el nombre del estudiante
      const nombre = prompt("Por favor, ingresa tu nombre:");
      if (!nombre) {
        alert("Debes ingresar tu nombre para continuar.");
        return;
      }

      // Capturar los datos de la tabla
      const xValues = [];
      const fValues = [];
      const FValues = [];
      const frValues = [];
      const percentValues = [];
      const angleValues = [];

      const filas = document.querySelectorAll("tbody tr");
      filas.forEach((fila, index) => {
        if (index < 7) { // Solo las primeras 7 filas de datos
          xValues.push(fila.querySelector(".x").value);
          fValues.push(fila.querySelector(".f").value);
          FValues.push(fila.querySelector(".F").value);
          frValues.push(fila.querySelector(".fr").value);
          percentValues.push(fila.querySelector(".percent").value);
          angleValues.push(fila.querySelector(".angle").value);
        }
      });

      // Capturar los totales
      const totalF = document.querySelector(".f-total").value;
      const totalFr = document.querySelector(".fr-total").value;
      const totalPercent = document.querySelector(".percent-total").value;
      const totalAngle = document.querySelector(".angle-total").value;

      // Capturar los resultados de cuartiles, deciles y percentiles
      const Q1 = document.getElementById("Q1").value;
      const Q2 = document.getElementById("Q2").value;
      const Q3 = document.getElementById("Q3").value;
      const D5 = document.getElementById("D5").value;
      const D9 = document.getElementById("D9").value;
      const P45 = document.getElementById("P45").value;
      const P74 = document.getElementById("P74").value;

      // Formatear los datos de la tabla
      const formatoTabla = `
x: ${xValues.join(", ")}
f: ${fValues.join(", ")}
F: ${FValues.join(", ")}
fr: ${frValues.join(", ")}
%: ${percentValues.join(", ")}
Ángulo: ${angleValues.join(", ")}
      `.trim();

      // Crear el contenido del archivo
      let contenido = `Nombre del estudiante: ${nombre}\n\n`;
      contenido += "Datos de la tabla:\n";
      contenido += formatoTabla;
      contenido += `\n\nTotales: f=${totalF}, fr=${totalFr}, %=${totalPercent}, Ángulo=${totalAngle}\n\n`;
      contenido += `Q1: ${Q1}\n`;
      contenido += `Q2: ${Q2}\n`;
      contenido += `Q3: ${Q3}\n`;
      contenido += `D5: ${D5}\n`;
      contenido += `D9: ${D9}\n`;
      contenido += `P45: ${P45}\n`;
      contenido += `P74: ${P74}\n`;

      // Crear y descargar el archivo
      const blob = new Blob([contenido], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "tarea.txt";
      a.click();
      URL.revokeObjectURL(url);

      // Redirigir al usuario
      window.location.href = "../index.html";
    }
  </script>
